<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White circular background with subtle crisp border, like ArchDaily -->
  <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#E2E2DF" stroke-width="1.5" />
  
  <!-- Centered isometric architectural L mark -->
  <g transform="translate(15, 14)" stroke="#121316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer contour -->
    <path d="M6 5 L17 1 V21 L28 17 V29 L17 35 L6 30 Z" />
    <!-- Vertical ridge -->
    <path d="M17 1 V35" />
    <!-- Base plane crease -->
    <path d="M6 30 L17 24 L28 29" />
  </g>
</svg>